<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f1e9">
  <title>Sign in</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      color-scheme: light;
      --paper: #f3f1e9;
      --ink: #1e2923;
      --muted: #68736c;
      --green: #245944;
      --line: #d8d9d0;
      --orange: #e18158;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: 'DM Sans', sans-serif;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(360px, 0.95fr) minmax(440px, 1.05fr);
      min-height: 100vh;
      padding: 18px;
      gap: 18px;
    }

    .welcome {
      position: relative;
      display: flex;
      min-height: calc(100vh - 36px);
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: clamp(28px, 5vw, 64px);
      color: #f3f1e9;
      background: var(--green);
      animation: appear 650ms ease-out both;
    }

    .welcome::before,
    .welcome::after {
      position: absolute;
      z-index: 0;
      content: '';
      pointer-events: none;
    }

    .welcome::before {
      right: -120px;
      bottom: 8%;
      width: min(38vw, 440px);
      aspect-ratio: 1;
      border: 1px solid rgb(243 241 233 / 22%);
      border-radius: 50%;
      box-shadow: 0 0 0 38px rgb(243 241 233 / 5%), 0 0 0 76px rgb(243 241 233 / 5%), 0 0 0 114px rgb(243 241 233 / 5%);
    }

    .welcome::after {
      right: 11%;
      bottom: 18%;
      width: 78px;
      height: 78px;
      background: var(--orange);
      transform: rotate(45deg);
    }

    .brand,
    .welcome-copy,
    .welcome-footer { position: relative; z-index: 1; }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      color: var(--green);
      background: #f3f1e9;
      font-size: 17px;
      line-height: 1;
    }

    .welcome-copy { max-width: 500px; margin: auto 0; padding: 64px 0; }

    .eyebrow {
      margin: 0 0 20px;
      color: #c3d6c8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 480px;
      margin: 0;
      font-family: 'Manrope', sans-serif;
      font-size: clamp(42px, 5.5vw, 76px);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.04;
    }

    .welcome-copy > p:last-child {
      max-width: 350px;
      margin: 24px 0 0;
      color: #d0ddd2;
      font-size: 15px;
      line-height: 1.7;
    }

    .welcome-footer { color: #c3d6c8; font-size: 12px; }

    .form-side {
      display: grid;
      min-height: calc(100vh - 36px);
      place-items: center;
      padding: 40px 24px;
      animation: appear 650ms 100ms ease-out both;
    }

    .form-wrap { width: min(100%, 390px); }

    .form-wrap h2 {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .intro { margin: 9px 0 34px; color: var(--muted); font-size: 14px; }

    .field { margin-top: 21px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 2px;
      outline: none;
      color: var(--ink);
      background: #fbfaf6;
      font: inherit;
      font-size: 14px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input::placeholder { color: #9aa19b; }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgb(36 89 68 / 12%); }

    .password-control { position: relative; }
    .password-control input { padding-right: 76px; }

    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      padding: 5px;
      border: 0;
      color: var(--green);
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 25px;
      font-size: 12px;
    }

    .remember { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
    .remember input { width: 15px; height: 15px; margin: 0; accent-color: var(--green); }
    a { color: var(--green); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }

    .submit {
      display: flex;
      width: 100%;
      height: 50px;
      align-items: center;
      justify-content: space-between;
      padding: 0 17px;
      border: 0;
      border-radius: 2px;
      color: #fff;
      background: var(--green);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .submit:hover { background: #1b4937; }
    .submit:active { transform: translateY(1px); }
    .submit:focus-visible, .show-password:focus-visible, a:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

    .status { min-height: 20px; margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .status.error { color: #a33d2e; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
      .welcome { min-height: 270px; padding: 25px; }
      .welcome-copy { padding: 42px 0 26px; }
      .welcome-copy .eyebrow { margin-bottom: 12px; }
      h1 { max-width: 400px; font-size: clamp(38px, 10vw, 58px); }
      .welcome-copy > p:last-child { margin-top: 13px; font-size: 13px; }
      .welcome::before { right: -150px; bottom: -100px; width: 310px; }
      .welcome::after { right: 12%; bottom: 17%; width: 46px; height: 46px; }
      .form-side { min-height: auto; padding: 42px 20px 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="welcome" aria-labelledby="welcome-title">
      <div class="brand"><span class="brand-mark" aria-hidden="true">N</span><span>Northline</span></div>
      <div class="welcome-copy">
        <p class="eyebrow">A good place to begin</p>
        <h1 id="welcome-title">Make room for what matters.</h1>
        <p>Your workspace is ready when you are. Sign in to pick up where you left off.</p>
      </div>
      <footer class="welcome-footer">A quieter way to get things done.</footer>
    </section>

    <section class="form-side" aria-labelledby="form-title">
      <div class="form-wrap">
        <h2 id="form-title">Welcome back</h2>
        <p class="intro">Enter your details to sign in to your account.</p>
        <form id="login-form">
          <div class="field">
            <label for="username">User name</label>
            <input id="username" name="username" type="text" placeholder="Enter your user name" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-control">
              <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button class="show-password" id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>
          <div class="options">
            <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
            <a href="mailto:support@example.com?subject=Password%20reset">Forgot password?</a>
          </div>
          <button class="submit" type="submit"><span>Sign in</span><span aria-hidden="true">&#8594;</span></button>
          <p class="status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <script>
    const passwordField = document.querySelector('#password');
    const togglePassword = document.querySelector('#toggle-password');
    const loginForm = document.querySelector('#login-form');
    const formStatus = document.querySelector('#form-status');

    togglePassword.addEventListener('click', () => {
      const isVisible = passwordField.type === 'text';
      passwordField.type = isVisible ? 'password' : 'text';
      togglePassword.textContent = isVisible ? 'Show' : 'Hide';
      togglePassword.setAttribute('aria-pressed', String(!isVisible));
    });

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      formStatus.textContent = 'This form is ready to connect to an authentication service.';
      formStatus.classList.remove('error');
    });
  </script>
</body>
</html>
