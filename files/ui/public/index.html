<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeX-PBL IPC Addition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">CodeX-PBL <span>IPC Addition</span></div>
        <div class="status-bar">
            <span class="badge ok" id="logger-status">Logger: Active</span>
        </div>
    </header>

    <main class="dashboard">
        <!-- IPC Addition -->
        <section class="card module-ipc">
            <h2>IPC Fork/Pipe Addition Demo</h2>
            <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">
                Process 1 owns Number 1. Process 2 owns Number 2. 
                Process 2 sends its number to Process 1 via a POSIX pipe, 
                and Process 1 computes the sum.
            </p>
            <div class="controls">
                <input type="number" id="ipc-num1" placeholder="Number 1 (Process 1)">
                <input type="number" id="ipc-num2" placeholder="Number 2 (Process 2)">
                <button class="primary" id="btn-add" onclick="execIPC()">Add Numbers</button>
            </div>
            <div class="ipc-status" id="ipc-status">Waiting for input...</div>
            <div id="ipc-feedback" class="feedback"></div>
        </section>

        <!-- Logger Feed -->
        <section class="card module-logger">
            <h2>System Log (sim.log)</h2>
            <div class="log-container" id="log-feed">
                <!-- Logs will be populated here -->
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
