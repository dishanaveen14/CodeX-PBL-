<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeX-PBL IPC Addition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">CodeX-PBL <span>IPC Addition</span></div>
        <div class="status-bar">
            <span class="badge ok" id="logger-status">Logger: Active</span>
        </div>
    </header>

    <main class="dashboard">
        <!-- IPC Addition -->
        <section class="card module-ipc">
            <h2>IPC Fork/Pipe Addition Demo</h2>
            <p class="module-desc">
                Process 1 owns Number 1. Process 2 owns Number 2. 
                Process 2 sends its number to Process 1 via a POSIX pipe, 
                and Process 1 computes the sum.
            </p>
            <div class="controls">
                <div class="input-group">
                    <label for="ipc-num1">Number 1 (Process 1)</label>
                    <input type="number" class="input-field" id="ipc-num1" placeholder="Enter first number...">
                </div>
                <div class="input-group">
                    <label for="ipc-num2">Number 2 (Process 2)</label>
                    <input type="number" class="input-field" id="ipc-num2" placeholder="Enter second number...">
                </div>
                <button class="primary" id="btn-add" onclick="execIPC()">Add Numbers</button>
            </div>
            <div class="ipc-status" id="ipc-status">Waiting for input...</div>
            <div id="ipc-feedback" class="feedback"></div>
        </section>

        <!-- Logger Feed -->
        <section class="card module-logger">
            <div class="card-header-row">
                <h2>System Log (sim.log)</h2>
                <button class="secondary btn-sm" onclick="clearLogs()">Clear Log</button>
            </div>
            <div class="log-container" id="log-feed">
                <!-- Logs will be populated here -->
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
